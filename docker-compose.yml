version: '3.8'

services:
  kisansetu-web:
    build: .
    container_name: kisansetu_app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_ENV=production
      - JWT_SECRET=kisansetu-production-secret-sih-2026
    volumes:
      - ./backend/db:/app/backend/db
    restart: unless-stopped
